    <body ondragstart="return false;" ondrop="return false;" >
        <div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
        <script>
            $(document).ready(function () {
                const urlParams = new URLSearchParams(window.location.search);

                const errMessage = urlParams.get('e')
                const tokenkey = urlParams.get('t');

                if (errMessage != undefined && errMessage != '') {
                    var errorHtml = `<!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>`+errMessage+`</title>
                        <!-- Bootstrap CSS -->
                        <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
                    </head>
                    <body style="background-color: none !important;">
                        <div class="container">
                            <div class="row mt-5">
                                <div class="col-md-6 offset-md-3">
                                    <div class="alert alert-danger">
                                        `+errMessage+`
                                    </div>
                                </div>
                            </div>
                        </div>
                    </body>
                    </html>
                    `
                    $('body').css('background', 'none');
                    $('body').html(errorHtml);
                } else if (tokenkey != undefined && tokenkey != '')
                {
                    // Get the value of a specific parameter
                    const tokenkey = urlParams.get('t'); // Returns 'value1'
                    localStorage.setItem('t', tokenkey);
                    $.ajax({
                        url: '/user/info',
                        type: 'GET',
                        data: {
                            't': localStorage.getItem('t'),
                            'gameID': 3
                        },
                        success: function(response) {
                            var oMain = new CMain({
                                hero_rotation_speed: 15, //HERO ROTATION SPEED WHEN MOVING RIGHT/LEFT
                                hero_speed_up: 65, //SET THIS MAX HERO SPEED WHEN PRESS UP KEY
                                hero_speed: 60, //MAX HERO SPEED
                                snakes_AI_speed: [60, 60, 60, 60],
                                food_score: [1], //ADD SCORE WHEN SNAKE EAT A FOOD BY TYPE  
                                fullscreen:true, //SET THIS TO FALSE IF YOU DON'T WANT TO SHOW FULLSCREEN BUTTON
                                check_orientation:true, //SET TO FALSE IF YOU DON'T WANT TO SHOW ORIENTATION ALERT ON MOBILE DEVICES,
                                data: response
                            });

                            $(oMain).on("start_session", function (evt) {
                                if (getParamValue('ctl-arcade') === "true") {
                                    parent.__ctlArcadeStartSession();
                                }
                            });

                            $(oMain).on("end_session", function (evt) {
                                if (getParamValue('ctl-arcade') === "true") {
                                    parent.__ctlArcadeEndSession();
                                }
                            });

                            $(oMain).on("start_level", function (evt, iLevel) {
                                if (getParamValue('ctl-arcade') === "true") {
                                    parent.__ctlArcadeStartLevel({level: iLevel});
                                }
                            });

                            $(oMain).on("restart_level", function (evt, iLevel) {
                                if (getParamValue('ctl-arcade') === "true") {
                                    parent.__ctlArcadeRestartLevel({level: iLevel});
                                }
                            });

                            $(oMain).on("end_level", function (evt, iLevel) {
                                if (getParamValue('ctl-arcade') === "true") {
                                    parent.__ctlArcadeEndLevel({level: iLevel});
                                }
                            });

                            $(oMain).on("save_score", function (evt, iScore, szMode) {
                                if (getParamValue('ctl-arcade') === "true") {
                                    parent.__ctlArcadeSaveScore({score: iScore, mode: szMode});
                                }
                            });

                            $(oMain).on("show_interlevel_ad", function (evt) {
                                if (getParamValue('ctl-arcade') === "true") {
                                    parent.__ctlArcadeShowInterlevelAD();
                                }
                            });

                            $(oMain).on("share_event", function (evt, iScore) {
                                if (getParamValue('ctl-arcade') === "true") {
                                    parent.__ctlArcadeShareEvent({img: TEXT_SHARE_IMAGE,
                                        title: TEXT_SHARE_TITLE,
                                        msg: TEXT_SHARE_MSG1 + iScore + TEXT_SHARE_MSG2,
                                        msg_share: TEXT_SHARE_SHARE1 + iScore + TEXT_SHARE_SHARE1});
                                }
                            });


                            if (isIOS()) {
                                setTimeout(function () {
                                    sizeHandler();
                                }, 200);
                            } else {
                                sizeHandler();
                            }
                        },
                        error: function(xhr, status, error) {
                            window.location.replace('/login?t='+tokenkey);
                        }
                    });
                }
            });

        </script>
 
        <div class="check-fonts">
            <p class="check-font-1">palamecia_titlingregular</p>

        <canvas id="canvas" class='ani_hack' width="1360" height="768"> </canvas>
        <div data-orientation="landscape" class="orientation-msg-container"><p class="orientation-msg-text">Please rotate your device</p></div>
        <div id="block_game" style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%; display:none"></div>

        <script>
            try {
                const urlParams = new URLSearchParams(window.location.search);

                // Get the value of a specific parameter
                const tokenkey = urlParams.get('t'); // Returns 'value1'

                if (tokenkey == undefined || tokenkey == '') {
                    redirectToWithAuth('https://www.player1.win/games/3/snakes', 'Token not found', 0);
                }
            } catch (error) {
                redirectToWithAuth('https://www.player1.win/games/3/snakes', 'Token not found', 0);
            }
        </script>
